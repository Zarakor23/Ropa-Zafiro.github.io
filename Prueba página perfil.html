<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zafiro - Perfil</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { corePlugins: { preflight: false } }
  </script>

  <style>
    :root {
      --zafiro-dark: #1b263b; 
      --zafiro-blue: #526f93; 
      --zafiro-bg: #e2e8f0;   
      --profile-input-bg: #ced4da; 
    }

    body { background-color: var(--zafiro-bg); font-family: Arial, sans-serif; }

    /* ========================================== */
    /* SECCIÓN DE PERFIL Y ANIMACIÓN              */
    /* ========================================== */
    .profile-avatar-container {
      width: 320px;
      height: 320px;
      border: 25px solid var(--zafiro-blue);
      border-radius: 50%;
      margin: 0 auto;
      overflow: hidden;
      background-color: #b9d2e8; 
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      animation: flotar 3s ease-in-out infinite;
    }

    @keyframes flotar {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

    /* ========================================== */
    /* NUEVOS ESTILOS PARA LAS ETIQUETAS Y CAMPOS */
    /* ========================================== */
    
    /* Contenedor para la etiqueta y el input stacked */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 25px; 
    }

    /* Estilo de la etiqueta del campo */
    .field-label {
      font-size: 14px;
      color: #777;
      margin-bottom: 5px;
      font-family: Arial, sans-serif;
      font-weight: normal;
      text-align: left;
    }

    /* Ajuste de .profile-input */
    .profile-input {
      background-color: var(--profile-input-bg);
      border: none;
      border-radius: 0; 
      padding: 15px 20px;
      width: 100%;
      font-size: 18px;
      color: #333;
      transition: background-color 0.3s;
      margin-bottom: 0; 
    }
    .profile-input:not([readonly]) {
      background-color: #ffffff;
      box-shadow: inset 0 0 0 2px var(--zafiro-blue);
    }
    .profile-input:focus { outline: none; }

    .btn-edit-glossy {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid #1a4a75;
      background: radial-gradient(circle at 50% 15%, #88cfff 0%, #1771b9 40%, #063460 100%);
      color: white;
      font-weight: bold;
      font-size: 28px; 
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 20px 20px rgba(255,255,255,0.5), inset 0 -10px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-edit-glossy:hover { transform: scale(1.05); }
    .btn-edit-glossy:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(0,0,0,0.4), inset 0 10px 10px rgba(255,255,255,0.3); }

  </style>
</head>
<body class="relative overflow-x-hidden">
  
  <div id="toastNotification" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#009688] text-white px-6 py-3 rounded-full shadow-[0_10px_25px_rgba(0,150,136,0.5)] opacity-0 -translate-y-10 transition-all duration-500 z-[2000] font-bold flex items-center pointer-events-none">
     <i class="bi bi-check-circle-fill text-xl mr-2"></i> <span id="toastMsg">¡Foto actualizada correctamente!</span>
  </div>

  <div class="container-fluid px-5 mt-5">
    <div class="row align-items-center">
      
      <div class="col-md-5 text-center mb-5 mb-md-0">
        
        <div class="profile-avatar-container relative group cursor-pointer" onclick="document.getElementById('profilePicInput').click()" title="Cambiar foto de perfil">
          
          <img id="profileImage" src="C:\Users\chris\OneDrive\Desktop\Boceto Página HTML Proyecto diseño\Imagenes categorias\tu-avatar.png" alt="Avatar Usuario" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
          
          <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center text-white">
            <i class="bi bi-camera-fill text-4xl mb-1 transform scale-75 group-hover:scale-100 transition-transform duration-300"></i>
            <span class="font-bold tracking-wider text-sm drop-shadow-md">CAMBIAR FOTO</span>
          </div>

          <input type="file" id="profilePicInput" class="hidden" accept="image/*">
        </div>

      </div>

      <div class="col-md-7 pe-md-5">
        <form id="profileForm">
          <div class="form-group mb-4">
            <label for="dbName" class="field-label">Nombre</label>
            <input type="text" id="dbName" class="profile-input editable-field" value="Chris" readonly> 
          </div>
          <div class="form-group mb-4">
            <label for="dbPhone" class="field-label">Teléfono</label>
            <input type="text" id="dbPhone" class="profile-input editable-field" value="+1 234 567 890" readonly>
          </div>
          <div class="form-group mb-4">
            <label for="dbEmail" class="field-label">Correo</label>
            <input type="email" id="dbEmail" class="profile-input editable-field" value="chris@example.com" readonly>
          </div>
          <div class="form-group mb-4">
            <label for="dbPassword" class="field-label">Contraseña</label> 
            <input type="password" id="dbPassword" class="profile-input editable-field" value="••••••••" readonly> 
          </div>
        </form>

        <div class="text-end mt-4 me-5">
          <button type="button" class="btn-edit-glossy" id="btnEditar">EDIT</button>
        </div>
      </div>

    </div>
  </div>

<script>
  /* ========================================================
     NUEVO: CARGAR DATOS DE LA "BASE DE DATOS LOCAL" AL INICIAR
     ======================================================== */
  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('zafiro_name')) document.getElementById('dbName').value = localStorage.getItem('zafiro_name');
    if (localStorage.getItem('zafiro_phone')) document.getElementById('dbPhone').value = localStorage.getItem('zafiro_phone');
    if (localStorage.getItem('zafiro_email')) document.getElementById('dbEmail').value = localStorage.getItem('zafiro_email');
    if (localStorage.getItem('zafiro_password')) document.getElementById('dbPassword').value = localStorage.getItem('zafiro_password');
    if (localStorage.getItem('zafiro_avatar')) document.getElementById('profileImage').src = localStorage.getItem('zafiro_avatar');
  });

  /* Logica de Edición del Perfil */
  const btnEditar = document.getElementById('btnEditar');
  const editableFields = document.querySelectorAll('.editable-field');
  let isEditing = false;

  btnEditar.addEventListener('click', () => {
    if (!isEditing) {
      // Activar edición
      editableFields.forEach(field => {
        field.removeAttribute('readonly');
      });
      // El primer campo obtiene el foco para que el usuario note que puede escribir
      if(editableFields.length > 0) {
        editableFields[0].focus();
      }
      btnEditar.innerText = 'SAVE';
      isEditing = true;
    } else {
      // Guardar cambios
      editableFields.forEach(field => {
        field.setAttribute('readonly', 'true');
      });
      
      // Guardar en la "base de datos local" (localStorage)
      localStorage.setItem('zafiro_name', document.getElementById('dbName').value);
      localStorage.setItem('zafiro_phone', document.getElementById('dbPhone').value);
      localStorage.setItem('zafiro_email', document.getElementById('dbEmail').value);
      localStorage.setItem('zafiro_password', document.getElementById('dbPassword').value);

      btnEditar.innerText = 'EDIT';
      isEditing = false;

      // Mostrar Toast de éxito
      document.getElementById('toastMsg').innerText = "¡Datos guardados correctamente!";
      const toast = document.getElementById('toastNotification');
      toast.classList.remove('opacity-0', '-translate-y-10');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-10');
      }, 3000);
    }
  });

  /* Logica Carga de Foto de Perfil y GUARDADO DE FOTO */
  document.getElementById('profilePicInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const imageData = e.target.result;
        document.getElementById('profileImage').src = imageData;
        
        // Guardar la foto en la base de datos local
        localStorage.setItem('zafiro_avatar', imageData);
        
        // Muestra el Toast de Notificación
        document.getElementById('toastMsg').innerText = "¡Foto actualizada correctamente!";
        const toast = document.getElementById('toastNotification');
        toast.classList.remove('opacity-0', '-translate-y-10');
        toast.classList.add('opacity-100', 'translate-y-0');
        
        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', '-translate-y-10');
        }, 3000);
      }
      reader.readAsDataURL(file);
    }
  });
</script>
</body>
</html>
