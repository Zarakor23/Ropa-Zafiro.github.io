    tailwind.config = { corePlugins: { preflight: false } }

  <style>
    :root {
      --zafiro-blue: #526f93;
      --zafiro-dark: #1b263b; 
      --zafiro-bg: #e2e8f0;   
      --zafiro-red: #ff1e1e;  
      --zafiro-icon-blue: #0084ff; 
    }

    body {
      background-color: var(--zafiro-bg);
      font-family: Arial, sans-serif;
      margin: 0; 
      overflow: hidden; 
    }

    /* Top Bar y Navbar */
    .top-bar { background-color: var(--zafiro-dark); padding: 10px 0; }
    .zafiro-navbar { background-color: var(--zafiro-blue); color: white; }
    .search-bar { border-radius: 20px; padding-left: 15px; }

    /* EL IFRAME (LA "VENTANA" CENTRAL) */
    #pantalla_principal {
      width: 100%;
      height: calc(100vh - 145px); 
      border: none;
      display: block;
      background-color: var(--zafiro-bg);
    }

    /* Scroll de Notificaciones */
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #1b263b; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #526f93; border-radius: 4px; }

    /* ESTILOS DEL MINI PLAYER */
    .mini-player-button { 
      position: fixed; bottom: 30px; right: 90px; background: #181818; border: 2px solid #00e5ff; 
      border-radius: 50%; width: 65px; height: 65px; display: flex; justify-content: center; align-items: center;
      cursor: pointer; z-index: 999; box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3); transition: all 0.3s ease; 
      font-size: 28px; color: #00e5ff;
    }
    .mini-player-button:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5); }
    
    .mini-player-container { 
      position: fixed; bottom: 30px; right: 30px; background: #181818; border: 1px solid #333; 
      border-radius: 15px; padding: 15px; width: 280px; box-shadow: 0 8px 25px rgba(0,0,0,0.7); 
      z-index: 998; display: none; flex-direction: column; gap: 10px; user-select: none;
    }
    .mini-player-container.active { display: flex; }
    .mini-player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: grab; }
    .mini-player-header:active { cursor: grabbing; }
    .mini-player-title { color: #fff; font-size: 12px; font-weight: bold; flex: 1; pointer-events: none; }
    .mini-player-close { background: none; border: none; color: #00e5ff; cursor: pointer; font-size: 18px; padding: 0; }
    .mini-cover-art { display: none; }
    .mini-controls { display: flex; justify-content: center; align-items: center; gap: 8px; }
    .mini-btn { 
      background: #252525; border: 1px solid #444; color: white; border-radius: 50%; width: 35px; height: 35px;
      cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; font-size: 14px; 
    }
    .mini-btn:hover { background: #333; border-color: #00e5ff; color: #00e5ff; }
    .mini-btn-play { width: 45px; height: 45px; background: #00e5ff; color: #000; font-size: 1.1rem; border: none; }
    .mini-btn-play:hover { background: #00d4e8; }
    .mini-track-info { color: #999; font-size: 11px; text-align: center; }

    /* BOTÓN DE WHATSAPP ANCLADO AL MINI PLAYER */
    .whatsapp-mini-btn {
      position: absolute;
      top: 50%;
      left: -65px; 
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background-color: #25d366;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, background-color 0.2s ease;
      text-decoration: none;
      z-index: 1000;
    }
    .whatsapp-mini-btn:hover {
      transform: translateY(-50%) scale(1.1);
      background-color: #1ebe57;
      color: white;
    }
  </style>

  <script>
    // 1. Lógica del Menú
    function toggleMainMenu() {
      const menu = document.getElementById('tailwindMainMenu');
      if (menu.classList.contains('invisible')) {
        menu.classList.remove('invisible', 'opacity-0', 'scale-95');
        menu.classList.add('opacity-100', 'scale-100');
      } else {
        menu.classList.add('invisible', 'opacity-0', 'scale-95');
        menu.classList.remove('opacity-100', 'scale-100');
      }
    }

    // 2. Buscador
    function redireccionarBusqueda(event) {
      event.preventDefault();
      const busqueda = document.getElementById('inputBusqueda').value.toLowerCase().trim();
      const iframe = window.frames['pantalla_principal'];
      switch (busqueda) {
        case 'ropa mujer': case 'mujer': iframe.location.href = 'Prueba página mujeres.html'; break;
        case 'ropa hombre': case 'hombre': iframe.location.href = 'Prueba página hombre.html'; break;
        case 'ropa unisex': case 'unisex': iframe.location.href = 'Prueba página unisex.html'; break;
        default: alert('Por favor, busca "ropa mujer", "ropa hombre" o "ropa unisex".'); break;
      }
      document.getElementById('inputBusqueda').value = '';
    }

    // 3. Carrito Global
    let carritoGlobal = JSON.parse(localStorage.getItem('zafiro_carrito_global')) || [];
    window.addEventListener('storage', function(e) {
      if (e.key === 'zafiro_carrito_global' || e.key === 'zafiro_solicitudes') {
        carritoGlobal = JSON.parse(localStorage.getItem('zafiro_carrito_global')) || [];
        actualizarCarritoUI();
        cargarNotificacionDinamica();
      }
    });

    function actualizarCarritoUI() {
        const container = document.getElementById('cartItemsContainer');
        const countBadge = document.getElementById('cartItemCount');
        const totalSpan = document.getElementById('cartTotalAmount');
        const modalTotal = document.getElementById('modalTotalAmount');
        const btnPagar = document.getElementById('checkoutBtn');
        if (!container) return;

        const totalItems = carritoGlobal.reduce((acc, item) => acc + item.cantidad, 0);
        
        if (totalItems > 0) {
            countBadge.style.display = 'block';
            countBadge.innerText = totalItems;
            if(btnPagar) btnPagar.disabled = false;
        } else {
            countBadge.style.display = 'none';
            if(btnPagar) btnPagar.disabled = true;
        }
        
        container.innerHTML = '';
        let totalPrecio = 0;
        
        if (carritoGlobal.length === 0) {
            container.innerHTML = '<div class="text-center text-muted my-3 py-2">Tu carrito está vacío</div>';
        } else {
            carritoGlobal.forEach((item, index) => {
                totalPrecio += item.precio * item.cantidad;
                container.innerHTML += `
                    <div class="d-flex align-items-center justify-content-between border-bottom pb-2 mb-2">
                        <img src="${item.imagen}" alt="${item.nombre}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 5px;">
                        <div class="flex-grow-1 mx-2" style="font-size: 0.8rem; line-height: 1.1;">
                            <div class="fw-bold text-truncate text-dark" style="max-width: 140px;">${item.nombre}</div>
                            <div class="text-muted">$${item.precio.toLocaleString('es-CO')} x ${item.cantidad}</div>
                        </div>
                        <button class="btn btn-sm text-danger p-0" onclick="eliminarDelCarrito(event, ${index})"><i class="bi bi-trash"></i></button>
                    </div>`;
            });
        }
        
        const formatoPrecio = '$' + totalPrecio.toLocaleString('es-CO');
        if(totalSpan) totalSpan.innerText = formatoPrecio;
        if(modalTotal) modalTotal.innerText = formatoPrecio;
    }

    function eliminarDelCarrito(event, index) {
        event.stopPropagation();
        carritoGlobal.splice(index, 1);
        localStorage.setItem('zafiro_carrito_global', JSON.stringify(carritoGlobal));
        actualizarCarritoUI();
    }

    function confirmarPago(metodo) { 
        alert(`Redirigiendo a la pasarela de pago con ${metodo}...`);
    }

    // 4. Perfil y Notificaciones
    function toggleProfileLogic(event) {
      event.stopPropagation();
      const iframe = window.frames['pantalla_principal'];
      let urlIframe = "";
      
      try {
        urlIframe = iframe.location.href.toLowerCase();
      } catch(e) {
        urlIframe = "";
      }

      if (!urlIframe.includes('solicitudes')) {
        iframe.location.href = 'Inicio de sesion V1.html';
        return;
      }

      const notif = document.getElementById('profileNotification');
      const badge = document.getElementById('notificationBadge');
      
      if (notif.classList.contains('invisible')) {
        notif.classList.remove('invisible', 'opacity-0', 'scale-95');
        notif.classList.add('opacity-100', 'scale-100');
        let solicitudes = JSON.parse(localStorage.getItem('zafiro_solicitudes')) || [];
        const resueltas = solicitudes.filter(s => s.respuesta && s.respuesta.trim() !== '');
        localStorage.setItem('zafiro_notificaciones_vistas', resueltas.length);
        if(badge) badge.style.display = 'none';
      } else {
        notif.classList.add('invisible', 'opacity-0', 'scale-95');
        notif.classList.remove('opacity-100', 'scale-100');
      }
    }

    function cargarNotificacionDinamica() {
      let solicitudes = JSON.parse(localStorage.getItem('zafiro_solicitudes')) || [];
      const resueltas = solicitudes.filter(s => s.respuesta && s.respuesta.trim() !== '');
      const badge = document.getElementById('notificationBadge');
      const panelContenido = document.getElementById('panelNotificacionContenido');
      let vistasCount = parseInt(localStorage.getItem('zafiro_notificaciones_vistas')) || 0;

      if (resueltas.length > 0) {
        if (badge) badge.style.display = (resueltas.length > vistasCount) ? 'flex' : 'none';
        let htmlContenido = '';
        const resueltasInvertidas = [...resueltas].reverse();
        
        resueltasInvertidas.forEach(notif => {
            htmlContenido += `
              <div class="mb-4 border-b border-[#1b263b] pb-3 last:border-0 last:mb-0 last:pb-0">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-[10px] bg-[#009688] px-2 py-1 rounded-full text-white font-bold tracking-wider shadow">RESUELTA</span>
                  <span class="text-[10px] text-gray-200">ID: ${notif.id}</span>
                </div>
                <p class="text-sm font-bold mt-1 mb-1 text-white">Solicitud de ${notif.tipo}</p>
                <p class="text-xs text-gray-200 m-0 leading-relaxed"><strong>Respuesta de Zafiro:</strong> ${notif.respuesta}</p>
              </div>
            `;
        });
        panelContenido.classList.remove('justify-center');
        panelContenido.innerHTML = htmlContenido;
      } else {
        if (badge) badge.style.display = 'none';
        panelContenido.classList.add('flex-col', 'justify-center');
        panelContenido.innerHTML = `<p class="text-sm text-gray-300 text-center italic m-0 py-4">No tienes notificaciones nuevas.</p>`;
      }
    }

    document.addEventListener('click', () => {
      const notif = document.getElementById('profileNotification');
      if (notif && !notif.classList.contains('invisible')) {
        notif.classList.add('invisible', 'opacity-0', 'scale-95');
        notif.classList.remove('opacity-100', 'scale-100');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      actualizarCarritoUI();
      cargarNotificacionDinamica();
    });
  </script>

    let miniCurrentIdx = 0; let miniPlayer = new Audio(); const miniPlayerContainer = document.getElementById('miniPlayerContainer'); const miniTrackTitle = document.getElementById('miniTrackTitle'); const miniPlayPauseBtn = document.getElementById('miniPlayPause');
    function toggleMiniPlayer() { miniPlayerContainer.classList.toggle('active'); }
    function miniLoadTrack(index, playNow) { if (miniPlaylist.length === 0) return; miniCurrentIdx = index; const track = miniPlaylist[miniCurrentIdx]; miniPlayer.src = track.file; miniTrackTitle.innerText = track.title; if (playNow) { miniPlayer.play(); miniPlayPauseBtn.innerHTML = '⏸'; } }
    function miniTogglePlay() { if (miniPlaylist.length === 0) return; if (miniPlayer.paused) { miniPlayer.play(); miniPlayPauseBtn.innerHTML = '⏸'; } else { miniPlayer.pause(); miniPlayPauseBtn.innerHTML = '▶'; } }
    function miniSeek(seconds) { miniPlayer.currentTime = Math.max(0, miniPlayer.currentTime + seconds); }
    function miniIncreaseVolume() { miniPlayer.volume = Math.min(1, miniPlayer.volume + 0.1); document.getElementById('volumePercentage').innerText = Math.round(miniPlayer.volume * 100); }
    function miniDecreaseVolume() { miniPlayer.volume = Math.max(0, miniPlayer.volume - 0.1); document.getElementById('volumePercentage').innerText = Math.round(miniPlayer.volume * 100); }
    function miniNextTrack() { let next = (miniCurrentIdx + 1) % miniPlaylist.length; miniLoadTrack(next, true); }
    function miniPrevTrack() { let prev = miniCurrentIdx - 1 < 0 ? miniPlaylist.length - 1 : miniCurrentIdx - 1; miniLoadTrack(prev, true); }
    miniPlayer.onended = () => { miniNextTrack(); };
    if (miniPlaylist.length > 0) { miniLoadTrack(0, false); }
    miniPlayer.volume = 0.5;
    
    // Arrastrar reproductor
    const miniHeader = document.querySelector('.mini-player-header'); let isDraggingMini = false; let miniOffsetX = 0; let miniOffsetY = 0;
    miniHeader.addEventListener('mousedown', (e) => { isDraggingMini = true; const rect = miniPlayerContainer.getBoundingClientRect(); miniOffsetX = e.clientX - rect.left; miniOffsetY = e.clientY - rect.top; });
    document.addEventListener('mousemove', (e) => { if (isDraggingMini) { miniPlayerContainer.style.bottom = 'auto'; miniPlayerContainer.style.right = 'auto'; miniPlayerContainer.style.left = (e.clientX - miniOffsetX) + 'px'; miniPlayerContainer.style.top = (e.clientY - miniOffsetY) + 'px'; } });
    document.addEventListener('mouseup', () => { isDraggingMini = false; });
