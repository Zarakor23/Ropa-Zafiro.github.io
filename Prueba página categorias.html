<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zafiro - Categorías</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Configuramos Tailwind para que NO borre los estilos de Bootstrap
    tailwind.config = {
      corePlugins: {
        preflight: false,
      }
    }
  </script>

  <style>
    :root {
      /* Colores base oficiales */
      --zafiro-dark: #1b263b;
      --zafiro-blue: #526f93; 
      --zafiro-bg: #e2e8f0;   
      --avatar-bg: #eee4d4;
    }

    body {
      background-color: var(--zafiro-bg);
      font-family: Arial, sans-serif;
      padding: 15px 0;
    }

    /* ========================================== */
    /* CÍRCULOS DE CATEGORÍAS                     */
    /* ========================================== */
    .category-circle {
      width: 250px;
      height: 250px;
      background-color: var(--avatar-bg);
      border: 20px solid var(--zafiro-blue);
      border-radius: 50%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .category-circle:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .category-circle img {
      width: 80%;
      height: 80%;
      max-width: 200px;
      max-height: 200px;
      object-fit: contain; 
      aspect-ratio: 1;
    }
  </style>
</head>
<body>

  <div class="container-fluid px-5 my-4">
    
    <div id="carouselExampleIndicators" class="carousel slide mb-5" data-bs-ride="carousel" data-bs-interval="3000">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
      </div>
      
      <div class="carousel-inner rounded-3 shadow">
        <div class="carousel-item active">
          <img src="https://images.unsplash.com/photo-1567401893414-76b7b1e5a7a5?q=80&w=2070&auto=format&fit=crop" class="d-block w-100 object-fit-cover" height="350" alt="Banner Zafiro 1">
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?q=80&w=2070&auto=format&fit=crop" class="d-block w-100 object-fit-cover" height="350" alt="Banner Zafiro 2">
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1445205170230-053b83016050?q=80&w=2070&auto=format&fit=crop" class="d-block w-100 object-fit-cover" height="350" alt="Banner Zafiro 3">
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
        <span class="carousel-control-prev-icon bg-secondary rounded-circle p-3" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
        <span class="carousel-control-next-icon bg-secondary rounded-circle p-3" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>

    <div class="container mt-5 mb-5">
      <div class="row justify-content-center g-4">
        
        <div class="col-md-4 text-center">
          <a href="Prueba página hombre.html" class="text-decoration-none">
            <div class="category-circle">
              <img src="https://www.svgrepo.com/show/428254/matureman1.svg" alt="Categoría Hombre">
            </div>
          </a>
        </div>
        
        <div class="col-md-4 text-center">
          <a href="Prueba página mujeres.html" class="text-decoration-none">
            <div class="category-circle">
              <img src="https://www.svgrepo.com/show/428251/female.svg" alt="Categoría Mujer">
            </div>
          </a>
        </div>
        
        <div class="col-md-4 text-center">
          <a href="Prueba página unisex.html" class="text-decoration-none">
            <div class="category-circle">
              <img src="https://www.svgrepo.com/show/36378/unisex-bathroom-sign.svg" alt="Categoría unisex">
            </div>
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
