<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Zafiro - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --zafiro-bg: #e2e8f0;   
      --login-header-bg: #287b92;
      --login-card-bg: #d7f4ee;
      --login-input-bg: #577dca;
      --login-link: #3aaebd;
      --login-btn-bg: #74b3c3;
      --login-btn-shadow: #a1c6c2;
    }
    body { background-color: var(--zafiro-bg); font-family: Arial, sans-serif; }
    .login-container { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 550px; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .login-header { background-color: var(--login-header-bg); color: white; text-align: center; padding: 25px 20px; }
    .login-header h2 { margin: 0; font-family: "Georgia", serif; font-size: 32px; letter-spacing: 1px; }
    .login-body { background-color: var(--login-card-bg); padding: 40px 50px; text-align: center; }
    .login-text { color: #333; font-weight: bold; margin-bottom: 20px; font-size: 15px; }
    .login-link { color: var(--login-link); text-decoration: none; font-weight: bold; margin-left: 10px; }
    .login-link:hover { text-decoration: underline; color: #278895; }
    .login-input { background-color: var(--login-input-bg); border: none; color: white; border-radius: 10px; padding: 12px 20px; margin-bottom: 15px; width: 100%; font-size: 15px; }
    .login-input::placeholder { color: rgba(255, 255, 255, 0.7); }
    .login-input:focus { outline: none; box-shadow: 0 0 0 3px rgba(87, 125, 202, 0.5); }
    .login-btn { background-color: var(--login-btn-bg); color: white; border: none; width: 100%; padding: 15px; font-size: 22px; border-radius: 12px; margin-top: 25px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 5px 5px 0px var(--login-btn-shadow); transition: all 0.2s ease; }
    .login-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0px var(--login-btn-shadow); }
  </style>
</head>
<body>

  <div class="container login-container mt-4">
    <div class="login-card">
      <div class="login-header">
        <h2>Inicia sesión</h2>
      </div>
      <div class="login-body">
        <p class="login-text">
          ¿Aún no tienes una cuenta? <a href="Resgistrarse V1.html" class="login-link">Regístrate</a>
        </p>
        <form>
          <input type="text" class="login-input" placeholder="Usuario">
          <input type="password" class="login-input" placeholder="Contraseña">
          <p class="login-text mt-4">
            ¿Olvidaste tu contraseña? <a href="Recuperar contraseña (nueva contraseña).html" class="login-link">Recuperar contraseña</a>
          </p>
          <button type="button" class="login-btn" onclick="window.location.href='Prueba home.html'">CONTINUAR</button>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
