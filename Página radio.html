<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Multimedia Engineering: High-Fidelity Player</title>
    <style>
        body {
            background: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        /* ESTILO NUCLEAR / CYBERPUNK */
        .player-card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 24px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        
        .player-card.dragging {
            cursor: grabbing;
            opacity: 0.9;
        }

        #cover-art {
            width: 220px;
            height: 220px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border 0.3s ease;
            border: 3px solid transparent;
        }

        .playing-fx {
            border-color: #00e5ff !important;
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3) !important;
        }

        h2 { margin: 10px 0 5px 0; font-size: 1.4rem; color: #fff; }
        #format-badge { 
            font-size: 0.7rem; 
            background: #00e5ff; 
            color: #000; 
            padding: 2px 8px; 
            border-radius: 4px; 
            text-transform: uppercase;
            font-weight: bold;
            display: none; /* Se activa al cargar */
        }

        /* CONTROLES */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .nav-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            background: #252525;
            border: 1px solid #444;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover { background: #333; border-color: #00e5ff; color: #00e5ff; }
        
        .btn-main {
            width: 70px; height: 70px;
            background: #00e5ff;
            color: #000;
            font-size: 1.8rem;
            border: none;
        }

        /* GRID DE LIBRERÍA */
        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin-top: 40px;
        }

        .track-card {
            background: #181818;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
            text-align: center;
        }

        .track-card:hover, .active-track {
            background: #222;
            border-color: #00e5ff;
        }

        .track-card img { width: 100%; border-radius: 8px; margin-bottom: 8px; }
        .track-card p { margin: 0; font-size: 0.85rem; font-weight: 500; }
    </style>
</head>

            card.className = 'track-card';
            card.id = `track-${index}`;
            card.innerHTML = `
                <img src="${track.cover}">
                <p>${track.title}</p>
                <small style="color:#555">${track.file.split('.').pop().toUpperCase()}</small>
            `;
            card.onclick = () => loadTrack(index);
            libContainer.appendChild(card);
        });

        function loadTrack(index) {
            currentIdx = index;
            const song = playlist[index];
            
            player.src = song.file;
            document.getElementById('display-title').innerText = song.title;
            document.getElementById('display-filename').innerText = song.file;
            art.src = song.cover;
            document.getElementById('track-counter').innerText = (index + 1) + "/" + playlist.length;

            // Mostrar extensión (FLAC/MP3)
            const ext = song.file.split('.').pop().toUpperCase();
            const badge = document.getElementById('format-badge');
            badge.innerText = ext;
            badge.style.display = "inline-block";

            // UI Activa
            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active-track'));
            document.getElementById(`track-${index}`).classList.add('active-track');

            play();
        }

        function togglePlay() {
            if (!player.src) return alert("Elige un archivo de la librería");
            player.paused ? play() : pause();
        }

        function play() {
            player.play().then(() => {
                btnPlay.innerText = "⏸";
                art.classList.add('playing-fx');
            }).catch(err => {
                alert("Error: Asegúrate de que el archivo '" + playlist[currentIdx].file + "' esté en la misma carpeta.");
            });
        }

        function pause() {
            player.pause();
            btnPlay.innerText = "▶";
            art.classList.remove('playing-fx');
        }

        function seek(seconds) {
            player.currentTime += seconds;
        }

        // Auto-Play: Siguiente canción
        player.onended = () => {
            let next = (currentIdx + 1) % playlist.length;
            loadTrack(next);
        };
        
        // FUNCIONES DE NAVEGACIÓN
        function nextTrack() {
            let next = (currentIdx + 1) % playlist.length;
            loadTrack(next);
        }
        
        function previousTrack() {
            let prev = currentIdx - 1 < 0 ? playlist.length - 1 : currentIdx - 1;
            loadTrack(prev);
        }
        
        // HACER EL PLAYER MOVIBLE (DRAGGABLE)
        playerCard.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - playerCard.offsetLeft;
            offsetY = e.clientY - playerCard.offsetTop;
            playerCard.classList.add('dragging');
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                playerCard.style.position = 'fixed';
                playerCard.style.left = (e.clientX - offsetX) + 'px';
                playerCard.style.top = (e.clientY - offsetY) + 'px';
                playerCard.style.width = '350px';
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
            playerCard.classList.remove('dragging');
        });
    </script>
</body>
</html>
