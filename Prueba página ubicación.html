<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zafiro - Ubicación</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { corePlugins: { preflight: false } }
  </script>

  <style>
    :root {
      --zafiro-dark: #1b263b; 
      --zafiro-blue: #526f93; 
      --zafiro-bg: #e2e8f0;   
      --zafiro-teal: #009688; 
    }

    body { background-color: var(--zafiro-bg); font-family: Arial, sans-serif; }

    /* Tarjetas de Ubicación */
    .location-main-card { background-color: var(--zafiro-teal); border-radius: 40px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .inner-white-card { background-color: white; border-radius: 20px; padding: 15px; margin-bottom: 20px; overflow: hidden; }
    .inner-white-card:last-child { margin-bottom: 0; }
    
    .map-container { width: 100%; height: 250px; border-radius: 15px; overflow: hidden; position: relative; }
    .map-container iframe, .map-container img { width: 100%; height: 100%; border: none; object-fit: cover; }

    .storefront-img { border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .address-text { color: #333; font-weight: bold; font-size: 24px; margin-top: 20px; }
  </style>
</head>
<body class="relative">

  <div class="container-fluid px-5 my-5">
    <div class="row align-items-start g-5">
      
      <div class="col-md-6">
        <div class="location-main-card">
          
          <div class="inner-white-card">
            <div class="row align-items-center">
              <div class="col-6">
                <img src="Fachada tienda.png" alt="Miniatura Tienda" class="img-fluid rounded">
              </div>
              <div class="col-6 p-0 text-dark" style="font-size: 10px;">
                <p class="m-0 fw-bold">Zafiro Ropa</p>
                <p class="m-0 text-muted">Cra. 41A # 4B-26</p>
                <p class="m-0 text-warning">★★★★★ <span class="text-dark">(5.0)</span></p>
              </div>
            </div>
          </div>

          <div class="inner-white-card p-0">
            <div class="map-container group bg-black">
              
              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3976.994247738221!2d-74.123456789!3d4.612345678!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e3f9be4a9a01237%3A0x23456789abcde01!2sCra.+41A+%23+4B-26%2C+Bogot%C3%A1!5e0!3m2!1ses!2sco!4v1701234567890!5m2!1ses!2sco" class="w-full h-full transition-transform duration-700 group-hover:scale-110 group-hover:opacity-60" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
              
              <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center gap-3 backdrop-blur-[2px]">
                 
                 <a href="https://www.google.com/maps/dir/?api=1&destination=Cra.+41A+%23+4B-26,+Bogota" target="_blank" class="bg-[#009688] text-white px-5 py-2.5 rounded-full font-bold hover:bg-[#00c4b3] transition-colors shadow-lg transform hover:scale-105 text-decoration-none border-2 border-transparent">
                    <i class="bi bi-geo-alt-fill me-1"></i> Cómo llegar
                 </a>
                 
                 <button onclick="copyAddress()" class="bg-[#1b263b] text-white px-5 py-2.5 rounded-full font-bold hover:bg-[#526f93] transition-colors shadow-lg transform hover:scale-105 border-0">
                    <i class="bi bi-clipboard-check me-1"></i> Copiar Dirección
                 </button>
              </div>

            </div>
          </div>

        </div>
      </div>

      <div class="col-md-6 text-center text-md-start">
        <img src="Fachada tienda.png" class="img-fluid storefront-img w-100" alt="Fachada Tienda Zafiro">
        <p class="address-text">
          Dirección: Cra. 41A # 4B-26
        </p>
      </div>

    </div>
  </div>

  <div id="copyToast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 translate-y-10 transition-all duration-300 z-[2000] font-bold flex items-center pointer-events-none">
     <i class="bi bi-check-circle-fill text-xl mr-2"></i> ¡Dirección copiada al portapapeles!
  </div>

<script>
  // Lógica para copiar al portapapeles y mostrar la notificación Toast
  function copyAddress() {
    // Escribe la dirección en el portapapeles del dispositivo
    navigator.clipboard.writeText("Cra. 41A # 4B-26, Bogotá").then(() => {
      const toast = document.getElementById('copyToast');
      
      // Muestra la notificación animando su entrada
      toast.classList.remove('opacity-0', 'translate-y-10');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      // La oculta automáticamente después de 3 segundos
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-10');
      }, 3000);
    }).catch(err => {
      console.error('Error al copiar: ', err);
    });
  }
</script>
</body>
</html>
