<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Zafiro - Solicitudes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --zafiro-dark: #1b263b; --zafiro-blue: #526f93; --zafiro-bg: #e2e8f0; }
    body { background-color: var(--zafiro-bg); font-family: Arial, sans-serif; }
    .pill-main { background-color: var(--zafiro-blue); color: white; border-radius: 50px; padding: 15px 30px; font-family: "Georgia", serif; font-size: 20px; letter-spacing: 1px; text-align: center; width: 100%; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .pill-sub { background-color: var(--zafiro-blue); color: white; border-radius: 50px; padding: 10px 20px; font-family: "Georgia", serif; font-size: 16px; letter-spacing: 1px; text-align: center; width: 300px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .icon-box { background-color: var(--zafiro-dark); width: 300px; height: 180px; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
    .icon-box:hover { transform: scale(1.03); box-shadow: 0 15px 25px rgba(0,0,0,0.25); }
    .icon-box i { font-size: 80px; color: var(--zafiro-blue); }
    .anim-intercambio { animation: moverHorizontal 2.5s ease-in-out infinite alternate; }
    @keyframes moverHorizontal { 0% { transform: translateX(-8px); } 100% { transform: translateX(8px); } }
    .anim-devolucion { animation: flotarVertical 3s ease-in-out infinite alternate; }
    @keyframes flotarVertical { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(-10px) scale(1.05); } }
    input:focus, textarea:focus { outline: none !important; box-shadow: none !important;}
  </style>
</head>
<body class="relative">

  <div class="container-fluid px-5 mt-5">
    <div class="row justify-content-center mb-5">
      <div class="col-12 text-center">
        <div class="pill-main">SOLICITUDES</div>
      </div>
    </div>
    <div class="row ms-md-5 ps-md-5">
      <div class="col-md-6">
        <div class="mb-5">
          <div class="pill-sub">INTERCAMBIO</div>
          <div class="icon-box" onclick="openModal('intercambio')">
            <i class="bi bi-arrow-repeat anim-intercambio"></i>
          </div>
        </div>
        <div class="mb-5">
          <div class="pill-sub">DEVOLUCIÓN</div>
          <div class="icon-box" onclick="openModal('devolucion')">
            <i class="bi bi-box-arrow-right anim-devolucion"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="solicitudModal" class="fixed inset-0 bg-black/60 z-[1100] hidden flex items-center justify-center opacity-0 transition-opacity duration-300 backdrop-blur-sm">
    <div id="modalContent" class="bg-[#1b263b] rounded-[30px] p-6 w-[350px] shadow-2xl transform scale-90 transition-all duration-500 relative">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors">
          <i class="bi bi-x-lg text-2xl"></i>
        </button>
        <div id="formView" class="block opacity-100 transition-opacity duration-300">
           <h3 id="modalTitle" class="text-white text-center font-[Georgia] text-2xl mb-5 tracking-widest uppercase">INTERCAMBIO</h3>
           <div class="mb-3">
              <span class="bg-[#526f93] text-white text-[11px] px-4 py-1 rounded-full uppercase block w-max mb-1 ml-2 shadow font-bold">Producto</span>
              <input type="text" id="solicitudProducto" class="w-full bg-[#e2e8f0] border-none rounded-full px-4 py-2 text-sm text-gray-800">
           </div>
           <div class="mb-3">
              <span class="bg-[#526f93] text-white text-[11px] px-4 py-1 rounded-full uppercase block w-max mb-1 ml-2 shadow font-bold">Factura</span>
              <div class="flex items-center ml-2">
                 <label class="cursor-pointer bg-[#e2e8f0] rounded-[20px] w-20 h-14 flex items-center justify-center shadow hover:bg-white transition-colors shrink-0">
                    <i class="bi bi-file-earmark-arrow-up text-3xl text-[#526f93]"></i>
                    <input type="file" id="facturaInput" class="hidden">
                 </label>
                 <span id="facturaStatus" class="ml-3 text-white text-xs opacity-0 transition-opacity duration-300 leading-tight"></span>
              </div>
           </div>
           <div class="mb-3">
              <span class="bg-[#526f93] text-white text-[11px] px-4 py-1 rounded-full uppercase block w-max mb-1 ml-2 shadow font-bold">Fecha de compra</span>
              <input type="date" id="solicitudFecha" class="w-full bg-[#e2e8f0] border-none rounded-full px-4 py-2 text-sm text-gray-800">
           </div>
           <div class="mb-5">
              <span id="razonLabel" class="bg-[#526f93] text-white text-[11px] px-4 py-1 rounded-full uppercase block w-max mb-1 ml-2 shadow font-bold">Razón de cambio</span>
              <textarea id="solicitudRazon" class="w-full bg-[#e2e8f0] border-none rounded-2xl px-4 py-3 text-sm text-gray-800 resize-none h-24"></textarea>
           </div>
           <div class="text-center">
              <button onclick="submitForm()" class="bg-[#009688] text-black font-bold tracking-widest px-8 py-2 rounded-full hover:bg-[#00c4b3] transition-colors shadow-[0_5px_15px_rgba(0,150,136,0.3)] text-lg">ENVIAR</button>
           </div>
        </div>
        <div id="successView" class="hidden opacity-0 transition-opacity duration-500 h-full">
           <div class="flex items-center justify-center h-full min-h-[250px] gap-6 px-4">
              <div class="animate-bounce">
                <i class="bi bi-person-workspace text-white text-[80px]"></i>
              </div>
              <div class="text-white text-left font-[Georgia] tracking-wide leading-relaxed flex-1">
                 <p class="mb-2 text-sm">¡TU SOLICITUD HA SIDO CORRECTAMENTE ENVIADA!</p>
                 <p class="mb-2 text-sm">NOS COMUNICAREMOS CONTIGO LO ANTES POSIBLE</p>
                 <p class="text-sm">GRACIAS POR ELEGIRNOS</p>
              </div>
           </div>
        </div>
    </div>
  </div>

  <script>
    let archivoBase64Temp = "";
    let nombreArchivoTemp = "";
    let tipoSolicitudActual = "INTERCAMBIO";

    document.getElementById('facturaInput').addEventListener('change', function(e) {
      const statusLabel = document.getElementById('facturaStatus');
      const file = e.target.files[0];
      if (file) {
        nombreArchivoTemp = file.name;
        const reader = new FileReader();
        reader.onload = function(event) {
          archivoBase64Temp = event.target.result; 
          statusLabel.innerHTML = `Factura cargada:<br><span class="font-bold text-[#00e5ff] truncate max-w-[120px] inline-block">${file.name}</span>`;
          statusLabel.classList.remove('opacity-0');
          statusLabel.classList.add('opacity-100');
        };
        reader.readAsDataURL(file);
      }
    });

    function openModal(tipo) {
      tipoSolicitudActual = tipo.toUpperCase();
      const modal = document.getElementById('solicitudModal');
      const content = document.getElementById('modalContent');
      const title = document.getElementById('modalTitle');
      const labelRazon = document.getElementById('razonLabel');

      document.getElementById('formView').classList.remove('hidden');
      document.getElementById('formView').classList.replace('opacity-0', 'opacity-100');
      document.getElementById('successView').classList.add('hidden');
      document.getElementById('successView').classList.replace('opacity-100', 'opacity-0');
      content.classList.replace('w-[600px]', 'w-[350px]');

      document.getElementById('solicitudProducto').value = '';
      document.getElementById('solicitudFecha').value = '';
      document.getElementById('solicitudRazon').value = '';
      document.getElementById('facturaInput').value = '';
      archivoBase64Temp = "";
      nombreArchivoTemp = "";
      
      const statusLabel = document.getElementById('facturaStatus');
      statusLabel.classList.remove('opacity-100');
      statusLabel.classList.add('opacity-0');
      statusLabel.innerHTML = '';

      if (tipo === 'intercambio') {
        title.innerText = 'INTERCAMBIO';
        labelRazon.innerText = 'RAZÓN DE CAMBIO';
      } else {
        title.innerText = 'DEVOLUCIÓN';
        labelRazon.innerText = 'RAZÓN DE DEVOLUCIÓN';
      }

      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-90');
        content.classList.add('scale-100');
      }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('solicitudModal');
      const content = document.getElementById('modalContent');
      modal.classList.add('opacity-0');
      content.classList.remove('scale-100');
      content.classList.add('scale-90');
      setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    document.getElementById('solicitudModal').addEventListener('click', function(e) {
      if (e.target === this) { closeModal(); }
    });

    function submitForm() {
      const producto = document.getElementById('solicitudProducto').value.trim();
      const fecha = document.getElementById('solicitudFecha').value;
      const razon = document.getElementById('solicitudRazon').value.trim();
      
      if (!producto || !fecha || !razon) {
        alert("Por favor rellena todos los campos obligatorios.");
        return;
      }

      let solicitudes = JSON.parse(localStorage.getItem('zafiro_solicitudes')) || [];
      const nuevaSolicitud = {
        id: Date.now(),
        tipo: tipoSolicitudActual,
        producto: producto,
        fecha: fecha,
        razon: razon,
        archivoCargado: archivoBase64Temp,
        nombreArchivo: nombreArchivoTemp,
        respuesta: "" 
      };
      
      solicitudes.push(nuevaSolicitud);
      localStorage.setItem('zafiro_solicitudes', JSON.stringify(solicitudes));

      const formView = document.getElementById('formView');
      const successView = document.getElementById('successView');
      const content = document.getElementById('modalContent');
      
      formView.classList.replace('opacity-100', 'opacity-0');
      
      setTimeout(() => {
        formView.classList.add('hidden');
        content.classList.replace('w-[350px]', 'w-[600px]');
        successView.classList.remove('hidden');
        setTimeout(() => {
          successView.classList.replace('opacity-0', 'opacity-100');
        }, 100);
      }, 300);
    }
  </script>
</body>
</html>
